  <div id="root">
    <!-- Inline fallback loader for cold starts (Render free tier) -->
    <style>
      .fallback-loader-container {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #F4F1EC;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #0D0D0D;
        z-index: 99999;
      }
      .fallback-loader-logo {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 24px;
        text-transform: uppercase;
        animation: pulseLogo 1.5s ease-in-out infinite;
      }
      .fallback-loader-bar {
        width: 120px;
        height: 1px;
        background-color: rgba(13, 13, 13, 0.1);
        position: relative;
        overflow: hidden;
      }
      .fallback-loader-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background-color: #0D0D0D;
        animation: loadingBar 1.2s infinite ease-in-out;
      }
      .fallback-loader-text {
        font-family: 'Space Mono', monospace;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-top: 16px;
        color: #6B6560;
      }
      @keyframes pulseLogo {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes loadingBar {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
    <div class="fallback-loader-container">
      <div class="fallback-loader-logo">DEVANG</div>
      <div class="fallback-loader-bar">
        <div class="fallback-loader-bar-fill"></div>
      </div>
      <div class="fallback-loader-text">Waking up server...</div>
    </div>
  </div>

  <!-- Lenis Smooth Scroll CDN -->
  <script src="https://unpkg.com/lenis@1.1.20/dist/lenis.min.js"></script>
  <script>
    const lenis = new Lenis({
      lerp: 0.08, // Very smooth deceleration
      wheelMultiplier: 0.8, // Smooth and controlled scroll speed
      smoothWheel: true,
      touchMultiplier: 1.5,
    })

    function raf(time) {
      lenis.raf(time)
      requestAnimationFrame(raf)
    }

    requestAnimationFrame(raf)
    
    // Expose lenis to window so we can use it in React
    window.lenis = lenis;
  </script>
